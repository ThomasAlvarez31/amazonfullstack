server:
  port: 8082

spring:
  application:
    name: ms-users
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:usersdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:rootpass}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
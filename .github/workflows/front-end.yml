name: CI/CD front-end

on:
  workflow_dispatch:
  push:
    branches: [deploy]
    paths:
      - 'front-end/**'
      - '.github/workflows/front-end.yml'

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push imagen
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/amazon-front:$IMAGE_TAG -t $REGISTRY/amazon-front:latest ./front-end
          docker push $REGISTRY/amazon-front:$IMAGE_TAG
          docker push $REGISTRY/amazon-front:latest

      - name: Desplegar en EC2 via SSM
        run: |
          cat > /tmp/ssm.json << 'ENDJSON'
          {
            "DocumentName": "AWS-RunShellScript",
            "InstanceIds": ["${{ secrets.EC2_WEB_INSTANCE_ID }}"],
            "Parameters": {
              "commands": [
                "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com",
                "cd /home/ec2-user/amazonfullstack && git pull origin deploy",
                "docker compose -f docker-compose.web.yml --env-file .env pull front-end",
                "docker compose -f docker-compose.web.yml --env-file .env up -d --no-deps front-end",
                "docker inspect -f '{{.State.Running}}' front-end | grep -q true"
              ]
            }
          }
          ENDJSON
          CMD_ID=$(aws ssm send-command --cli-input-json file:///tmp/ssm.json --region ${{ secrets.AWS_REGION }} --query "Command.CommandId" --output text)
          echo "CommandId: $CMD_ID"
          sleep 20
          aws ssm get-command-invocation --command-id $CMD_ID --instance-id ${{ secrets.EC2_WEB_INSTANCE_ID }} --region ${{ secrets.AWS_REGION }} --query "[StatusDetails,StandardOutputContent]" --output text

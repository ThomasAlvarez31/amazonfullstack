name: CI/CD ms-payments

on:
  workflow_dispatch:
  push:
    branches: [deploy]
    paths:
      - 'ms-payments/**'
      - '.github/workflows/ms-payments.yml'

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push imagen
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/amazon-ms-payments:$IMAGE_TAG -t $REGISTRY/amazon-ms-payments:latest ./ms-payments
          docker push $REGISTRY/amazon-ms-payments:$IMAGE_TAG
          docker push $REGISTRY/amazon-ms-payments:latest

      - name: Instalar kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Configurar kubectl para EKS
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

      - name: Desplegar en EKS
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/ms-payments ms-payments=$REGISTRY/amazon-ms-payments:$IMAGE_TAG -n amazon
          kubectl rollout status deployment/ms-payments -n amazon --timeout=120s

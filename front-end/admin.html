<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Amazon.cl</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .admin-layout { max-width: 960px; margin: 24px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 24px; }
    .admin-card { background: #fff; border-radius: 4px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .admin-card h2 { font-size: 18px; font-weight: 700; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 18px; }
    .admin-form { display: flex; flex-direction: column; gap: 10px; max-width: 480px; }
    .admin-form input { padding: 8px 10px; border: 1px solid #adb1b8; border-radius: 3px; font-size: 13px; }
    .admin-form button { background: #ff9900; border: 1px solid #e77600; border-radius: 3px; padding: 8px 20px; font-size: 13px; font-weight: 700; color: #0f1111; align-self: flex-start; }
    .admin-form button:hover { background: #f3a847; }
    .admin-result { margin-top: 10px; font-size: 13px; color: #007600; }
    .admin-result.error { color: #b12704; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
    .admin-table th { background: #f0f2f2; text-align: left; padding: 8px 10px; font-weight: 700; border-bottom: 2px solid #ddd; }
    .admin-table td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; }
    .admin-table tr:hover td { background: #fafafa; }
    .tab-row { display: flex; gap: 0; margin-bottom: 0; border-bottom: 2px solid #ff9900; }
    .tab-btn { padding: 8px 20px; background: #f0f2f2; border: 1px solid #ddd; border-bottom: none; font-size: 13px; font-weight: 700; color: #555; cursor: pointer; }
    .tab-btn.active { background: #fff; color: #0f1111; border-top: 2px solid #ff9900; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <div class="admin-layout">

    <div class="admin-card">
      <div class="tab-row">
        <button class="tab-btn active" data-tab="products">Productos</button>
        <button class="tab-btn" data-tab="users">Usuarios</button>
      </div>

      <div class="tab-panel active" id="tab-products" style="padding-top:20px">
        <h2>Agregar producto</h2>
        <div class="admin-form">
          <input id="p-name"     type="text"   placeholder="Nombre del producto" />
          <input id="p-price"    type="number" placeholder="Precio (ej: 29990)" min="0" />
          <input id="p-desc"     type="text"   placeholder="Descripcion (opcional)" />
          <input id="p-category" type="text"   placeholder="Categoria (opcional)" />
          <button id="btn-create-product">Crear producto</button>
          <div class="admin-result" id="product-result"></div>
        </div>

        <h2 style="margin-top:28px">Productos existentes</h2>
        <button id="btn-load-products" style="font-size:12px;background:#f0f2f2;border:1px solid #ddd;border-radius:3px;padding:5px 12px;margin-bottom:10px">Recargar lista</button>
        <table class="admin-table">
          <thead><tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Categoria</th></tr></thead>
          <tbody id="products-table"></tbody>
        </table>
      </div>

      <div class="tab-panel" id="tab-users" style="padding-top:20px">
        <h2>Agregar usuario</h2>
        <div class="admin-form">
          <input id="u-username" type="text"     placeholder="Nombre de usuario" />
          <input id="u-email"    type="email"    placeholder="Correo electronico" />
          <input id="u-password" type="password" placeholder="Contrasena" />
          <button id="btn-create-user">Crear usuario</button>
          <div class="admin-result" id="user-result"></div>
        </div>

        <h2 style="margin-top:28px">Usuarios existentes</h2>
        <button id="btn-load-users" style="font-size:12px;background:#f0f2f2;border:1px solid #ddd;border-radius:3px;padding:5px 12px;margin-bottom:10px">Recargar lista</button>
        <table class="admin-table">
          <thead><tr><th>ID</th><th>Username</th><th>Email</th></tr></thead>
          <tbody id="users-table"></tbody>
        </table>
      </div>
    </div>

  </div>

  <div id="footer"></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>

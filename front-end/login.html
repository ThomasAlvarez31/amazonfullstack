<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesion — Amazon.cl</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="background:#eaeded">

  <div style="background:#131921;text-align:center;padding:12px 0;margin-bottom:24px">
    <a href="index.html" style="color:#fff;font-size:26px;font-weight:800;letter-spacing:-1px">
      amazon<span style="color:#ff9900">.cl</span>
    </a>
  </div>

  <div class="login-wrap">
    <div class="login-tabs">
      <button id="tab-login" class="active">Iniciar sesion</button>
      <button id="tab-register">Crear cuenta</button>
    </div>

    <div class="login-box">

      <div id="section-login">
        <h1>Iniciar sesion</h1>
        <div class="error-msg" id="error-msg"></div>
        <div class="form-group">
          <label>Correo electronico</label>
          <input type="email" id="login-email" placeholder="tucorreo@ejemplo.com" />
        </div>
        <div class="form-group">
          <label>Contrasena</label>
          <input type="password" id="login-password" placeholder="Minimo 6 caracteres" />
        </div>
        <button class="btn-grad" id="btn-login">Continuar</button>
        <p style="font-size:11px;color:#555;margin-top:12px">
          Al continuar aceptas las <a href="#" style="color:#007185">Condiciones de uso</a>.
        </p>
      </div>

      <div id="section-register" style="display:none">
        <h1>Crea tu cuenta</h1>
        <div class="error-msg" id="error-msg-reg"></div>
        <div class="form-group">
          <label>Tu nombre</label>
          <input type="text" id="reg-username" placeholder="Nombre y apellido" />
        </div>
        <div class="form-group">
          <label>Correo electronico</label>
          <input type="email" id="reg-email" placeholder="tucorreo@ejemplo.com" />
        </div>
        <div class="form-group">
          <label>Contrasena</label>
          <input type="password" id="reg-password" placeholder="Minimo 6 caracteres" />
        </div>
        <button class="btn-grad" id="btn-register">Crear cuenta</button>
      </div>

    </div>
  </div>

  <div style="text-align:center;font-size:12px;color:#555;margin-top:20px;padding-bottom:32px">
    <a href="#" style="color:#007185;margin:0 8px">Condiciones de uso</a>
    <a href="#" style="color:#007185;margin:0 8px">Privacidad</a>
    <a href="#" style="color:#007185;margin:0 8px">Ayuda</a>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>

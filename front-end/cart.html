<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito — Amazon.cl</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="navbar"></div>

  <div class="container">
    <div class="cart-layout">

      <div class="cart-items" id="cart-items">
        <h1>Carrito de compras</h1>
        <p style="color:#555">Cargando...</p>
      </div>

      <div class="cart-summary">
        <div class="cart-summary__total">
          Subtotal (<span id="cart-item-count">0 artículos</span>):<br>
          <strong id="cart-subtotal">$0</strong>
        </div>
        <label style="font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:12px">
          <input type="checkbox"> Este pedido contiene un regalo
        </label>
        <button class="btn-checkout" id="btn-checkout">Proceder al pago</button>
        <p style="font-size:11px;color:#555;margin-top:8px;text-align:center">Pago 100% seguro con cifrado SSL</p>
      </div>

    </div>
  </div>

  <div id="footer"></div>

  <script type="module" src="js/cart.js"></script>
</body>
</html>

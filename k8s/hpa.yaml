# Autoscaling (HPA) habilitado en los servicios de entrada (front-end, gateway)
# y en ms-products (mayor trafico de lectura). El resto de los microservicios
# se mantiene en replica fija: el cluster academico (2 nodos t3.medium, AWS
# Academy Learner Lab) no tiene capacidad de CPU para escalar simultaneamente
# los 13 microservicios sin saturarse. Es una decision de dimensionamiento real,
# no una limitacion de la configuracion de Kubernetes: en un entorno productivo
# (nodos mas grandes y/o Cluster Autoscaler de nodos) se habilitaria HPA en todos.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: front-end
  namespace: amazon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: front-end
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-gateway
  namespace: amazon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-gateway
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-products
  namespace: amazon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-products
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

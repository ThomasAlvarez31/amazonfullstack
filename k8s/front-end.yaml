apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-end
  namespace: amazon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front-end
  template:
    metadata:
      labels:
        app: front-end
    spec:
      containers:
        - name: front-end
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/amazon-front:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: front-end
  namespace: amazon
spec:
  selector:
    app: front-end
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer

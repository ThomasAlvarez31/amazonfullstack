apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-reviews
  namespace: amazon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-reviews
  template:
    metadata:
      labels:
        app: ms-reviews
    spec:
      containers:
        - name: ms-reviews
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/amazon-ms-reviews:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: amazon-secrets
                  key: DB_HOST
            - name: DB_NAME
              value: reviewsdb
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amazon-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: JAVA_OPTS
              value: "-Xmx256m"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-reviews
  namespace: amazon
spec:
  selector:
    app: ms-reviews
  ports:
    - port: 8090
      targetPort: 8090
  type: ClusterIP

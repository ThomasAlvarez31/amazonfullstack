apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-wishlist
  namespace: amazon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ms-wishlist
  template:
    metadata:
      labels:
        app: ms-wishlist
    spec:
      containers:
        - name: ms-wishlist
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/amazon-ms-wishlist:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8092
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: amazon-secrets
                  key: DB_HOST
            - name: DB_NAME
              value: wishlistdb
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amazon-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: JAVA_OPTS
              value: "-Xmx256m"
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
            limits:
              memory: "256Mi"
              cpu: "600m"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-wishlist
  namespace: amazon
spec:
  selector:
    app: ms-wishlist
  ports:
    - port: 8092
      targetPort: 8092
  type: ClusterIP
